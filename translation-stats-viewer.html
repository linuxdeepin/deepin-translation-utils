<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepin Translation Statistics Viewer</title>
    <style>
        :root {
            --bg: #f6f8fa;
            --surface: #ffffff;
            --border: #d0d7de;
            --border-muted: #d8dee4;
            --text: #1f2328;
            --text-muted: #57606a;
            --accent: #0969da;
            --accent-hover: #0550ae;
            --green: #1a7f37;
            --orange: #9a6700;
            --red: #cf222e;
            --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 0 40px 0;
            line-height: 1.5;
            font-size: 14px;
        }

        .container {
            max-width: 1080px;
            margin: 24px auto 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 3px rgba(31, 35, 40, 0.04), 0 8px 24px rgba(66, 74, 83, 0.10);
        }

        .header {
            position: relative;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .upload-area {
            padding: 36px 20px;
            text-align: center;
            border: 2px dashed var(--border);
            margin: 16px;
            border-radius: 6px;
            background: #fafbfc;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: #f6f8fa;
        }

        .upload-area.drag-over {
            border-color: var(--accent);
            background: #ddf4ff;
        }

        .upload-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .upload-icon svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        .file-input {
            display: none;
        }

        .btn {
            display: inline-block;
            background: #f6f8fa;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            margin: 12px 4px 0 4px;
        }

        .btn:hover {
            background: #f3f4f6;
            border-color: #afb8c1;
        }

        .stats-container {
            padding: 0;
            display: none;
        }

        .overall-stats {
            position: relative;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px 20px 24px;
            text-align: left;
        }

        .overall-stats h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 14px;
        }

        .load-new-file-btn {
            position: absolute;
            top: 18px;
            right: 24px;
            background: #f6f8fa;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .load-new-file-btn:hover {
            background: #f3f4f6;
            border-color: #afb8c1;
        }

        .file-info {
            color: var(--text-muted);
            font-size: 12px;
            padding: 0 0 10px 0;
            margin-bottom: 14px;
            border-bottom: 1px dashed var(--border-muted);
            line-height: 1.6;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 0;
        }

        .stat-card {
            background: #f6f8fa;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            text-align: left;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 12px;
        }

        .finished { color: var(--green); }
        .unfinished { color: var(--orange); }
        .total { color: var(--accent); }
        .progress { color: var(--accent-hover); }

        .file-list {
            background: var(--surface);
            padding: 16px 24px;
        }

        .file-list h3 {
            margin-bottom: 12px;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
        }

        .file-item {
            background: var(--surface);
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .file-item:hover {
            border-color: #afb8c1;
        }

        .file-header {
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #f6f8fa;
            color: var(--text);
        }

        .file-path {
            font-family: var(--mono);
            font-weight: 500;
            font-size: 13px;
            word-break: break-all;
        }

        .file-progress {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .file-details {
            padding: 12px;
            display: none;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .file-details.show {
            display: block;
        }

        .lang-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 10px;
        }

        .lang-card {
            background: #fafbfc;
            border: 1px solid var(--border-muted);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .lang-code {
            font-family: var(--mono);
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            font-size: 13px;
        }

        .lang-progress-bar {
            width: 100%;
            height: 8px;
            background: #d8dee4;
            border-radius: 6px;
            overflow: hidden;
            margin: 8px 0;
        }

        .lang-progress-fill {
            height: 100%;
            background: var(--green);
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .lang-stats-text {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .expand-icon {
            display: inline-block;
            margin-left: 8px;
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.2s ease;
        }

        .expand-icon.rotated {
            transform: rotate(180deg);
        }

        .error-message {
            background: var(--surface);
            color: var(--red);
            padding: 16px;
            border-radius: 6px;
            margin: 0;
            border: 1px solid rgba(207, 34, 46, 0.35);
            border-left: 4px solid var(--red);
            text-align: left;
        }

        .error-message h3 {
            margin-bottom: 6px;
            font-size: 15px;
        }

        .error-message p {
            color: var(--text);
            margin-bottom: 8px;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid #d8dee4;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .filter-container {
            margin-bottom: 16px;
            padding: 12px 24px;
            background: #f6f8fa;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .filter-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--text);
            font-size: 12px;
        }

        .filter-input {
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .language-search-container {
            position: relative;
        }

        .language-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 8px 24px rgba(66, 74, 83, 0.12);
        }

        .language-dropdown.show {
            display: block;
        }

        .language-option {
            padding: 6px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f6f8fa;
            font-size: 13px;
        }

        .language-option:hover {
            background: #f6f8fa;
        }

        .language-option:last-child {
            border-bottom: none;
        }

        .language-option.highlighted {
            background: var(--accent);
            color: var(--surface);
        }

        .clear-filters {
            background: #f6f8fa;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .clear-filters:hover {
            background: #f3f4f6;
            border-color: #afb8c1;
        }

        .view-switch {
            margin: 16px 24px 12px 24px;
        }

        .view-switch-buttons {
            display: inline-flex;
            background: #f6f8fa;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px;
            gap: 2px;
        }

        .view-switch-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s ease, color 0.2s ease;
            background: transparent;
            color: var(--text-muted);
        }

        .view-switch-btn.active {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 500;
        }

        .view-switch-btn:hover:not(.active) {
            background: var(--surface);
            color: var(--text);
        }

        .language-toggle {
            position: absolute;
            top: 16px;
            right: 24px;
            background: #f6f8fa;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px;
            display: inline-flex;
            gap: 2px;
        }

        .language-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .language-toggle-btn.active {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
        }

        .language-toggle-btn:hover:not(.active) {
            background: var(--surface);
            color: var(--text);
        }

        .language-view {
            display: none;
            padding: 0 24px 16px 24px;
        }

        .language-view.active {
            display: block;
        }

        .language-item {
            background: var(--surface);
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .language-item:hover {
            border-color: #afb8c1;
        }

        .language-header {
            background: #f6f8fa;
            color: var(--text);
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .language-header:hover {
            background: #f0f2f4;
        }

        .language-title-section {
            text-align: left;
        }

        .language-code-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .language-code-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .language-progress-section {
            text-align: right;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-progress-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .language-details {
            display: none;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .language-details.show {
            display: block;
        }

        .language-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            background: #fafbfc;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        .language-stat {
            text-align: center;
        }

        .language-stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
        }

        .language-stat-label {
            color: var(--text-muted);
            font-size: 11px;
        }

        .language-files {
            padding: 12px;
        }

        .language-file-item {
            background: var(--surface);
            border: 1px solid var(--border-muted);
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 6px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .language-file-item:hover {
            background: #f6f8fa;
            border-color: var(--border);
        }

        .language-file-path {
            font-family: var(--mono);
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
            word-break: break-all;
            font-size: 13px;
        }

        .language-file-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .language-file-progress {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-progress-bar {
            width: 80px;
            height: 6px;
            background: #d8dee4;
            border-radius: 3px;
            overflow: hidden;
            flex: none;
        }

        .mini-progress-fill {
            height: 100%;
            background: var(--green);
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 6px;
            }

            .header {
                padding: 16px;
            }

            .header h1 {
                font-size: 17px;
            }

            .overall-stats {
                padding: 16px;
                padding-top: 64px;
            }

            .load-new-file-btn {
                position: static;
                display: block;
                margin: 0 auto 12px auto;
                width: fit-content;
            }

            .file-info {
                position: static;
                display: block;
                margin: 0 0 12px 0;
                text-align: left;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
                gap: 10px;
            }

            .file-header {
                flex-direction: column;
                gap: 6px;
                text-align: left;
                align-items: flex-start;
            }

            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .view-switch-buttons {
                flex-direction: column;
                width: 100%;
            }

            .view-switch-btn {
                width: 100%;
                margin: 1px 0;
            }

            .language-summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .language-header {
                flex-direction: column;
                gap: 6px;
                text-align: left;
                align-items: flex-start;
            }

            .language-title-section,
            .language-progress-section {
                text-align: left;
            }

            .language-code-title {
                font-size: 15px;
            }

            .language-file-stats {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .mini-progress-bar {
                width: 100%;
            }

            .language-toggle {
                position: static;
                margin: 0 0 12px 0;
                display: inline-flex;
            }
        }
</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="language-toggle">
                <button class="language-toggle-btn active" onclick="switchLanguage('zh-CN')" id="lang-zh">中文</button>
                <button class="language-toggle-btn" onclick="switchLanguage('en')" id="lang-en">EN</button>
            </div>
            <h1 data-i18n="header.title">Deepin Translation Statistics</h1>
            <p data-i18n="header.subtitle">加载并查看翻译项目的完成情况统计</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg></div>
            <h3 data-i18n="upload.title">点击选择或拖拽 JSON 文件到此处</h3>
            <p data-i18n="upload.description">支持 deepin-translation-utils 生成的统计文件</p>
            <button class="btn" onclick="document.getElementById('fileInput').click()" data-i18n="upload.button">选择文件</button>
            <input type="file" id="fileInput" class="file-input" accept=".json" />
        </div>

        <div class="stats-container" id="statsContainer">
            <div class="overall-stats">
                <div class="file-info" id="fileInfo">
                    <!-- 文件信息将在这里显示 -->
                </div>
                <button class="load-new-file-btn" onclick="loadNewFile()" data-i18n="stats.load_new">
                    加载新文件
                </button>
                <h2 data-i18n="stats.overall">总体统计</h2>
                <div class="stats-grid" id="overallStats">
                    <!-- 总体统计将在这里动态生成 -->
                </div>
            </div>

            <div class="view-switch">
                <div class="view-switch-buttons">
                    <button class="view-switch-btn active" onclick="switchView('file')" id="fileViewBtn" data-i18n="view.file_group">
                        按文件分组
                    </button>
                    <button class="view-switch-btn" onclick="switchView('language')" id="languageViewBtn" data-i18n="view.language_group">
                        按语言分组
                    </button>
                </div>
            </div>

            <div class="filter-container">
                <div class="filter-row">
                    <div class="filter-group">
                        <label data-i18n="filter.path">文件路径过滤</label>
                        <input type="text" class="filter-input" id="pathFilter" data-i18n-placeholder="filter.path_placeholder" placeholder="输入文件路径关键词...">
                    </div>
                    <div class="filter-group">
                        <label data-i18n="filter.language">语言代码搜索</label>
                        <div class="language-search-container">
                            <input type="text" class="filter-input" id="langFilter" data-i18n-placeholder="filter.language_placeholder" placeholder="输入语言代码或语言名称...">
                            <div class="language-dropdown" id="languageDropdown">
                                <!-- 语言选项将在这里动态生成 -->
                            </div>
                        </div>
                    </div>
                    <div class="filter-group">
                        <label data-i18n="filter.sort">排序方式</label>
                        <select class="filter-input" id="sortOrder">
                            <option value="alphabetical" data-i18n="filter.sort_name">按名称排序</option>
                            <option value="progress" data-i18n="filter.sort_progress">按完成度排序</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label data-i18n="filter.calculation">计算模式</label>
                        <select class="filter-input" id="calculationMode" onchange="switchCalculationMode()">
                            <option value="target" data-i18n="filter.target_based">基于目标语言条目</option>
                            <option value="source" data-i18n="filter.source_based">基于原语言条目</option>
                        </select>
                    </div>
                    <button class="clear-filters" onclick="clearFilters()" data-i18n="filter.clear">清除过滤</button>
                </div>
            </div>

            <div class="file-list" id="fileView">
                <h3 data-i18n="file.detailed_list">详细文件列表</h3>
                <div id="fileList">
                    <!-- 文件列表将在这里动态生成 -->
                </div>
            </div>

            <div class="language-view" id="languageView">
                <h3 data-i18n="language.grouped_view">按语言分组视图</h3>
                <div id="languageList">
                    <!-- 语言列表将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // 语言切换和国际化相关变量
        let currentLanguage = 'zh-CN'; // 默认中文
        
        // 翻译对象
        const translations = {
            'zh-CN': {
                'header.title': 'Deepin Translation Statistics',
                'header.subtitle': '加载并查看翻译项目的完成情况统计',
                'upload.title': '点击选择或拖拽 JSON 文件到此处',
                'upload.description': '支持 deepin-translation-utils 生成的统计文件',
                'upload.button': '选择文件',
                'upload.loading': '正在处理文件...',

        };

        let translationData = null;
        let allLanguages = new Set();
        let currentView = 'file'; // 'file' or 'language'
        let currentFileName = '';
        let currentFileSize = 0;
        let languageOptions = []; // 存储语言选项数据
        let selectedLanguageFilter = '';
        let uploadEventHandlers = null; // 存储上传区域的事件处理器
        let calculationMode = 'target'; // 'target' 或 'source' - 计算模式

        // 国际化功能
        function t(key) {
            return translations[currentLanguage][key] || key;
        }

        function updatePageLanguage() {
            // 更新所有带有 data-i18n 属性的元素
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                element.textContent = t(key);
            });

            // 更新 placeholder 属性
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                element.placeholder = t(key);
            });

            // 更新动态内容（如果已经加载了数据）
            if (translationData) {
                updateFileInfo();
                renderOverallStats();
                renderFileList();
                renderLanguageList();
            }
        }

        function switchLanguage(lang) {
            if (lang === currentLanguage) return;
            
            currentLanguage = lang;
            
            // 保存到 localStorage
            localStorage.setItem('language', lang);
            
            // 更新按钮状态
            document.getElementById('lang-zh').classList.toggle('active', lang === 'zh-CN');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            
            // 更新页面语言
            updatePageLanguage();
        }

        function detectBrowserLanguage() {
            // 检查是否有保存的语言偏好
            const savedLang = localStorage.getItem('language');
            if (savedLang && translations[savedLang]) {
                return savedLang;
            }
            
            // 检测浏览器语言
            const browserLang = navigator.language || navigator.userLanguage;
            
            // 检查是否是中文
            if (browserLang.startsWith('zh')) {
                return 'zh-CN';
            }
            
            // 默认返回英文
            return 'en';
        }

        // 初始化语言
        function initializeLanguage() {
            const detectedLang = detectBrowserLanguage();
            currentLanguage = detectedLang;
            
            // 更新按钮状态
            document.getElementById('lang-zh').classList.toggle('active', detectedLang === 'zh-CN');
            document.getElementById('lang-en').classList.toggle('active', detectedLang === 'en');
            
            // 更新页面语言
            updatePageLanguage();
        }

        // 文件上传处理
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const statsContainer = document.getElementById('statsContainer');

        // 定义事件处理器
        const dragOverHandler = (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        };

        const dragLeaveHandler = () => {
            uploadArea.classList.remove('drag-over');
        };

        const dropHandler = (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        };

        // 存储事件处理器引用
        uploadEventHandlers = {
            dragover: dragOverHandler,
            dragleave: dragLeaveHandler,
            drop: dropHandler
        };

        // 初始绑定拖拽处理
        uploadArea.addEventListener('dragover', dragOverHandler);
        uploadArea.addEventListener('dragleave', dragLeaveHandler);
        uploadArea.addEventListener('drop', dropHandler);

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // 处理文件
        function handleFile(file) {
            if (!file.name.endsWith('.json')) {
                showError(t('upload.invalid'));
                return;
            }

            // 记录文件信息
            currentFileName = file.name;
            currentFileSize = file.size;

            showLoading();

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    translationData = JSON.parse(e.target.result);
                    processData();
                    showStats();
                } catch (error) {
                    showError(t('upload.parse_error') + error.message);
                }
            };
            reader.readAsText(file);
        }

        // 显示加载状态
        function showLoading() {
            uploadArea.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>${t('upload.loading')}</p>
                </div>
            `;
        }

        // 显示错误
        function showError(message) {
            uploadArea.innerHTML = `
                <div class="error-message">
                    <h3>${t('upload.error')}</h3>
                    <p>${message}</p>
                    <button class="btn" onclick="loadNewFile()">${t('upload.restart')}</button>
                </div>
            `;
        }

        // 处理数据
        function processData() {
            allLanguages.clear();
            languageOptions = [];
            
            // 收集所有语言
            translationData.resource_groups.forEach(group => {
                group.target_lang_codes.forEach(lang => allLanguages.add(lang));
            });

            // 准备语言选项数据（包含显示名称）
            Array.from(allLanguages).forEach(langCode => {
                const displayName = getLanguageDisplayName(langCode);
                languageOptions.push({
                    code: langCode,
                    displayName: displayName,
                    searchText: `${displayName} ${langCode}`.toLowerCase()
                });
            });

            // 语言搜索功能将在showStats中设置
        }

        // 设置语言搜索功能
        function setupLanguageSearch() {
            const langFilter = document.getElementById('langFilter');
            const languageDropdown = document.getElementById('languageDropdown');
            
            if (!langFilter || !languageDropdown) {
                return; // 如果元素不存在，直接返回
            }
            
            // 移除旧的事件监听器（如果存在）
            langFilter.replaceWith(langFilter.cloneNode(true));
            const newLangFilter = document.getElementById('langFilter');
            
            let highlightedIndex = -1;

            // 搜索输入事件
            newLangFilter.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                highlightedIndex = -1;
                
                if (searchTerm === '') {
                    selectedLanguageFilter = '';
                    languageDropdown.classList.remove('show');
                    // 清空搜索时重新渲染统计信息
                    renderOverallStats();
                    renderFileList();
                    renderLanguageList();
                } else {
                    const filtered = languageOptions.filter(option => 
                        option.searchText.includes(searchTerm)
                    );
                    renderLanguageDropdown(filtered);
                    languageDropdown.classList.add('show');
                }
                
                applyFilters();
            });

            // 键盘导航
            newLangFilter.addEventListener('keydown', (e) => {
                const options = languageDropdown.querySelectorAll('.language-option');
                
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    highlightedIndex = Math.min(highlightedIndex + 1, options.length - 1);
                    updateHighlight(options);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    highlightedIndex = Math.max(highlightedIndex - 1, -1);
                    updateHighlight(options);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (highlightedIndex >= 0 && options[highlightedIndex]) {
                        selectLanguageOption(options[highlightedIndex].dataset.langCode);
                    }
                } else if (e.key === 'Escape') {
                    languageDropdown.classList.remove('show');
                    highlightedIndex = -1;
                }
            });

            // 点击外部关闭下拉框
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.language-search-container')) {
                    languageDropdown.classList.remove('show');
                    highlightedIndex = -1;
                }
            });
        }

        // 渲染语言下拉选项
        function renderLanguageDropdown(options) {
            const languageDropdown = document.getElementById('languageDropdown');
            languageDropdown.innerHTML = '';

            options.forEach(option => {
                const div = document.createElement('div');
                div.className = 'language-option';
                div.dataset.langCode = option.code;
                div.textContent = option.displayName;
                div.addEventListener('click', () => selectLanguageOption(option.code));
                languageDropdown.appendChild(div);
            });
        }

        // 更新高亮显示
        function updateHighlight(options) {
            options.forEach((option, index) => {
                option.classList.toggle('highlighted', index === highlightedIndex);
            });
        }

        // 选择语言选项
        function selectLanguageOption(langCode) {
            const langFilter = document.getElementById('langFilter');
            const languageDropdown = document.getElementById('languageDropdown');
            
            selectedLanguageFilter = langCode;
            const selectedOption = languageOptions.find(opt => opt.code === langCode);
            if (selectedOption && langFilter) {
                langFilter.value = selectedOption.displayName;
            }
            
            if (languageDropdown) {
                languageDropdown.classList.remove('show');
            }
            
            // 重新渲染统计信息和列表以反映语言特定的数据
            renderOverallStats();
            renderFileList();
            renderLanguageList();
            applyFilters();
        }

        // 显示统计信息
        function showStats() {
            uploadArea.style.display = 'none';
            statsContainer.style.display = 'block';
            
            updateFileInfo();
            renderOverallStats();
            renderFileList();
            renderLanguageList();
            setupFilters();
            setupLanguageSearch();
        }

        // 更新文件信息显示
        function updateFileInfo() {
            const fileInfoEl = document.getElementById('fileInfo');
            const fileSize = (currentFileSize / 1024).toFixed(1);
            const createTime = new Date().toLocaleString(currentLanguage === 'zh-CN' ? 'zh-CN' : 'en-US');
            
            fileInfoEl.innerHTML = `
                ${currentFileName} (${fileSize} KB)<br>
                ${t('time.loaded')}${createTime}
            `;
        }

        // 渲染总体统计
        function renderOverallStats() {
            const stats = calculateOverallStats();
            const overallStatsEl = document.getElementById('overallStats');
            
            overallStatsEl.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number total">${stats.totalFiles}</div>
                    <div class="stat-label">${t('stats.total_files')}${stats.statsContext}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number finished">${stats.totalFinished}</div>
                    <div class="stat-label">${t('stats.finished_entries')}${stats.statsContext}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number unfinished">${stats.totalUnfinished}</div>
                    <div class="stat-label">${t('stats.unfinished_entries')}${stats.statsContext}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number progress">${stats.overallProgress}%</div>
                    <div class="stat-label">${t('stats.overall_progress')}${stats.statsContext}</div>
                </div>
            `;
        }

        // 计算总体统计（支持语言特定统计和计算模式）
        function calculateOverallStats() {
            let totalFiles = 0;
            let totalFinished = 0;
            let totalTargetItems = 0; // 目标语言条目总数
            let totalSourceItems = 0; // 原语言条目总数
            let statsContext = '';

            translationData.resource_groups.forEach(group => {
                // 统计所有资源组的原语言条目
                const sourceTotal = group.source_stats.finished + group.source_stats.unfinished;
                
                // 如果有选定的语言过滤器
                if (selectedLanguageFilter) {
                    // 只有当该资源组存在选定语言时才统计
                    if (group.target_stats && group.target_stats[selectedLanguageFilter]) {
                        totalFiles++;
                        const langStats = group.target_stats[selectedLanguageFilter].stats;
                        totalFinished += langStats.finished;
                        totalTargetItems += langStats.finished + langStats.unfinished;
                        totalSourceItems += sourceTotal;
                    }
                } else {
                    // 统计所有资源组（包括没有目标语言的）
                    totalFiles++;
                    
                    // 如果有目标语言统计，累加所有语言的完成数
                    if (group.target_lang_codes && group.target_lang_codes.length > 0) {
                        Object.values(group.target_stats).forEach(langStats => {
                            totalFinished += langStats.stats.finished;
                            totalTargetItems += langStats.stats.finished + langStats.stats.unfinished;
                        });
                        // 原语言条目数按语言数量计算
                        totalSourceItems += sourceTotal * Object.keys(group.target_stats).length;
                    } else {
                        // 没有目标语言的资源组，贡献0完成数，但计入原语言条目数
                        totalSourceItems += sourceTotal;
                    }
                }
            });

            // 设置显示上下文
            if (selectedLanguageFilter) {
                const selectedLangName = getLanguageDisplayName(selectedLanguageFilter);
                statsContext = ` (${selectedLangName})`;
            } else {
                statsContext = ` ${t('stats.all_languages')}`;
            }

            // 根据计算模式选择基准
            const denominator = calculationMode === 'target' ? totalTargetItems : totalSourceItems;
            const overallProgress = denominator > 0 ? ((totalFinished / denominator) * 100).toFixed(2) : '0.00';

            return {
                totalFiles,
                totalFinished,
                totalUnfinished: denominator - totalFinished,
                overallProgress,
                statsContext: statsContext + ` ${calculationMode === 'target' ? t('stats.target_based') : t('stats.source_based')}`
            };
        }

        // 渲染文件列表
        function renderFileList() {
            const fileListEl = document.getElementById('fileList');
            fileListEl.innerHTML = '';

            // 获取排序方式
            const sortOrderEl = document.getElementById('sortOrder');
            const sortOrder = sortOrderEl ? sortOrderEl.value : 'alphabetical';
            
            // 准备数据并排序
            let fileData = translationData.resource_groups
                .filter(group => group.target_lang_codes.length > 0)
                .map(group => {
                    let totalFinished = 0;
                    let totalUnfinished = 0;
                    let progress = 0;
                    
                    // 如果有选定的语言过滤器，只计算该语言的进度
                    if (selectedLanguageFilter && group.target_stats[selectedLanguageFilter]) {
                        const langStats = group.target_stats[selectedLanguageFilter].stats;
                        totalFinished = langStats.finished;
                        totalUnfinished = langStats.unfinished;
                    } else {
                        // 否则计算所有语言的总体进度
                        Object.values(group.target_stats).forEach(langStats => {
                            totalFinished += langStats.stats.finished;
                            totalUnfinished += langStats.stats.unfinished;
                        });
                    }

                    // 根据计算模式选择基准
                    const sourceTotal = group.source_stats.finished + group.source_stats.unfinished;
                    const targetTotal = totalFinished + totalUnfinished;
                    const denominator = calculationMode === 'target' ? targetTotal : sourceTotal;
                    progress = denominator > 0 ? ((totalFinished / denominator) * 100).toFixed(2) : '0.00';
                    
                    return { group, progress, totalFinished, totalUnfinished };
                });

            // 排序
            if (sortOrder === 'progress') {
                fileData.sort((a, b) => parseFloat(b.progress) - parseFloat(a.progress)); // 按进度降序
            } else {
                fileData.sort((a, b) => a.group.source_path.localeCompare(b.group.source_path)); // 按名称升序
            }

            // 渲染
            fileData.forEach((item, index) => {
                const fileItem = createFileItem(item.group, index);
                fileListEl.appendChild(fileItem);
            });
        }

        // 创建文件项
        function createFileItem(group, index) {
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.dataset.sourcePath = group.source_path;

            // 计算文件进度（支持语言特定显示）
            let totalFinished = 0;
            let totalUnfinished = 0;
            let displayContext = '';
            
            // 如果有选定的语言过滤器，只计算该语言的进度
            if (selectedLanguageFilter && group.target_stats[selectedLanguageFilter]) {
                const langStats = group.target_stats[selectedLanguageFilter].stats;
                totalFinished = langStats.finished;
                totalUnfinished = langStats.unfinished;
                const selectedLangName = getLanguageDisplayName(selectedLanguageFilter);
                displayContext = ` (${selectedLangName})`;
            } else {
                // 否则计算所有语言的总体进度
                Object.values(group.target_stats).forEach(langStats => {
                    totalFinished += langStats.stats.finished;
                    totalUnfinished += langStats.stats.unfinished;
                });
                displayContext = t('file.all_languages');
            }

            // 根据计算模式选择基准
            const sourceTotal = group.source_stats.finished + group.source_stats.unfinished;
            const targetTotal = totalFinished + totalUnfinished;
            const denominator = calculationMode === 'target' ? targetTotal : sourceTotal;
            const progress = denominator > 0 ? ((totalFinished / denominator) * 100).toFixed(2) : '0.00';

            fileItem.innerHTML = `
                <div class="file-header" onclick="toggleFileDetails(${index})">
                    <div class="file-path">${group.source_path}</div>
                    <div class="file-progress">
                        ${progress}%${displayContext}
                        <span class="expand-icon" id="icon-${index}">▼</span>
                    </div>
                </div>
                <div class="file-details" id="details-${index}">
                    <div class="lang-stats" id="langStats-${index}">
                        ${renderLanguageStats(group)}
                    </div>
                </div>
            `;

            return fileItem;
        }

        // 渲染语言统计
        function renderLanguageStats(group) {
            let html = '';

            Object.entries(group.target_stats).forEach(([langCode, langData]) => {
                const stats = langData.stats;
                const total = stats.finished + stats.unfinished;
                const progress = total > 0 ? ((stats.finished / total) * 100).toFixed(2) : '0.00';

                html += `
                    <div class="lang-card">
                        <div class="lang-code">${langCode}</div>
                        <div class="lang-progress-bar">
                            <div class="lang-progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div class="lang-stats-text">
                            <span>${t('file.finished')}: ${stats.finished}</span>
                            <span>${t('file.unfinished')}: ${stats.unfinished}</span>
                            <span>${t('file.progress')}: ${progress}%</span>
                        </div>
                        <div style="font-size: 12px; color: #57606a; margin-top: 5px;">
                            ${t('file.path')}: ${langData.resource_path}
                        </div>
                    </div>
                `;
            });

            return html;
        }

        // 切换文件详情显示
        function toggleFileDetails(index) {
            const details = document.getElementById(`details-${index}`);
            const icon = document.getElementById(`icon-${index}`);
            
            if (details.classList.contains('show')) {
                details.classList.remove('show');
                icon.classList.remove('rotated');
            } else {
                details.classList.add('show');
                icon.classList.add('rotated');
            }
        }

        // 设置过滤器
        function setupFilters() {
            const pathFilter = document.getElementById('pathFilter');
            const sortOrder = document.getElementById('sortOrder');

            if (pathFilter) {
                pathFilter.addEventListener('input', applyFilters);
            }
            
            if (sortOrder) {
                sortOrder.addEventListener('change', () => {
                    renderFileList();
                    renderLanguageList();
                    applyFilters();
                });
            }
        }



        // 清除过滤器
        function clearFilters() {
            const pathFilter = document.getElementById('pathFilter');
            const langFilter = document.getElementById('langFilter');
            const sortOrder = document.getElementById('sortOrder');
            const calculationModeEl = document.getElementById('calculationMode');
            
            if (pathFilter) pathFilter.value = '';
            if (langFilter) langFilter.value = '';
            if (sortOrder) sortOrder.value = 'alphabetical';
            if (calculationModeEl) calculationModeEl.value = 'target';
            selectedLanguageFilter = '';
            calculationMode = 'target';
            
            // 隐藏语言下拉框
            const languageDropdown = document.getElementById('languageDropdown');
            if (languageDropdown) {
                languageDropdown.classList.remove('show');
            }
            
            // 重新渲染列表（应用默认排序） - 仅在有数据时
            if (translationData) {
                renderOverallStats();
                renderFileList();
                renderLanguageList();
                applyFilters();
            }
        }

        // 视图切换功能
        function switchView(viewType) {
            currentView = viewType;
            
            // 更新按钮状态
            document.getElementById('fileViewBtn').classList.toggle('active', viewType === 'file');
            document.getElementById('languageViewBtn').classList.toggle('active', viewType === 'language');
            
            // 切换视图显示
            const fileView = document.getElementById('fileView');
            const languageView = document.getElementById('languageView');
            
            if (viewType === 'file') {
                fileView.style.display = 'block';
                languageView.classList.remove('active');
            } else {
                fileView.style.display = 'none';
                languageView.classList.add('active');
            }
            
            // 应用当前过滤器
            applyFilters();
        }

        // 切换计算模式
        function switchCalculationMode() {
            const calculationModeEl = document.getElementById('calculationMode');
            calculationMode = calculationModeEl.value;
            
            // 重新渲染统计信息和列表
            renderOverallStats();
            renderFileList();
            renderLanguageList();
            applyFilters();
        }

        // 渲染语言列表
        function renderLanguageList() {
            const languageListEl = document.getElementById('languageList');
            languageListEl.innerHTML = '';

            // 按语言分组数据
            const languageData = groupByLanguage();
            
            // 获取排序方式
            const sortOrderEl = document.getElementById('sortOrder');
            const sortOrder = sortOrderEl ? sortOrderEl.value : 'alphabetical';

            // 准备语言数据并排序
            let langArray = Array.from(allLanguages).map(langCode => {
                const data = languageData[langCode];
                if (!data) return null;
                
                // 根据计算模式选择基准计算翻译完成度
                const denominator = calculationMode === 'target' ? data.totalTargetItems : data.totalSourceItems;
                const progress = denominator > 0 ? 
                    ((data.totalFinished / denominator) * 100).toFixed(2) : '0.00';
                
                return { langCode, data, progress };
            }).filter(Boolean);

            // 排序
            if (sortOrder === 'progress') {
                langArray.sort((a, b) => parseFloat(b.progress) - parseFloat(a.progress)); // 按进度降序
            } else {
                langArray.sort((a, b) => {
                    const displayNameA = getLanguageDisplayName(a.langCode);
                    const displayNameB = getLanguageDisplayName(b.langCode);
                    return displayNameA.localeCompare(displayNameB);
                }); // 按显示名称升序
            }

            // 渲染
            langArray.forEach((item, index) => {
                const languageItem = createLanguageItem(item.langCode, item.data, index);
                languageListEl.appendChild(languageItem);
            });
        }

        // 按语言分组数据
        function groupByLanguage() {
            const languageData = {};

            translationData.resource_groups.forEach(group => {
                Object.entries(group.target_stats).forEach(([langCode, langStats]) => {
                    if (!languageData[langCode]) {
                        languageData[langCode] = {
                            files: [],
                            totalFinished: 0,
                            totalUnfinished: 0,
                            totalFiles: 0
                        };
                    }

                    const stats = langStats.stats;
                    // 根据计算模式选择基准
                    const sourceTotal = group.source_stats.finished + group.source_stats.unfinished;
                    const targetTotal = stats.finished + stats.unfinished;
                    const denominator = calculationMode === 'target' ? targetTotal : sourceTotal;
                    const progress = denominator > 0 ? ((stats.finished / denominator) * 100).toFixed(2) : '0.00';
                    
                    languageData[langCode].files.push({
                        sourcePath: group.source_path,
                        targetPath: langStats.resource_path,
                        finished: stats.finished,
                        unfinished: stats.unfinished,
                        sourceTotal: sourceTotal,
                        targetTotal: targetTotal,
                        progress: progress
                    });

                    languageData[langCode].totalFinished += stats.finished;
                    languageData[langCode].totalTargetItems = (languageData[langCode].totalTargetItems || 0) + targetTotal;
                    languageData[langCode].totalSourceItems = (languageData[langCode].totalSourceItems || 0) + sourceTotal;
                    
                    // 根据计算模式选择基准来计算未完成数
                    if (calculationMode === 'target') {
                        languageData[langCode].totalUnfinished = languageData[langCode].totalTargetItems - languageData[langCode].totalFinished;
                    } else {
                        languageData[langCode].totalUnfinished = languageData[langCode].totalSourceItems - languageData[langCode].totalFinished;
                    }
                    
                    languageData[langCode].totalFiles++;
                });
            });

            return languageData;
        }

        // 获取语言显示名称
        function getLanguageDisplayName(langCode) {
            try {
                // 将下划线转换为连字符
                const bcp47Code = langCode.replace('_', '-');
                // 使用Intl.DisplayNames获取语言名称
                const displayNames = new Intl.DisplayNames(['zh-CN'], {type: 'language'});
                const languageName = displayNames.of(bcp47Code);
                return `${languageName} (${langCode})`;
            } catch (error) {
                // 如果获取失败，返回原始代码
                return langCode;
            }
        }

        // 创建语言项
        function createLanguageItem(langCode, langData, index) {
            const languageItem = document.createElement('div');
            languageItem.className = 'language-item';
            languageItem.dataset.languageCode = langCode;

            const total = langData.totalFinished + langData.totalUnfinished;
            const overallProgress = total > 0 ? ((langData.totalFinished / total) * 100).toFixed(2) : '0.00';
            const displayName = getLanguageDisplayName(langCode);
            
            languageItem.innerHTML = `
                <div class="language-header" onclick="toggleLanguageDetails(${index})">
                    <div class="language-title-section">
                        <div class="language-code-title">${displayName}</div>
                        <div class="language-code-subtitle">${langData.totalFiles} ${t('language.files_count')}</div>
                    </div>
                    <div class="language-progress-section">
                        <div class="language-progress-text">${overallProgress}%</div>
                        <span class="expand-icon" id="lang-icon-${index}">▼</span>
                    </div>
                </div>
                <div class="language-details" id="lang-details-${index}">
                    <div class="language-summary">
                        <div class="language-stat">
                            <div class="language-stat-number total">${langData.totalFiles}</div>
                            <div class="language-stat-label">${t('language.files')}</div>
                        </div>
                        <div class="language-stat">
                            <div class="language-stat-number finished">${langData.totalFinished}</div>
                            <div class="language-stat-label">${t('language.finished_entries')}</div>
                        </div>
                        <div class="language-stat">
                            <div class="language-stat-number unfinished">${langData.totalUnfinished}</div>
                            <div class="language-stat-label">${t('language.unfinished_entries')}</div>
                        </div>
                        <div class="language-stat">
                            <div class="language-stat-number progress">${overallProgress}%</div>
                            <div class="language-stat-label">${t('language.overall_progress')}</div>
                        </div>
                    </div>
                    <div class="language-files">
                        ${renderLanguageFiles(langData.files)}
                    </div>
                </div>
            `;

            return languageItem;
        }

        // 渲染语言文件列表
        function renderLanguageFiles(files) {
            return files.map(file => `
                <div class="language-file-item" data-source-path="${file.sourcePath}">
                    <div class="language-file-path">${file.sourcePath}</div>
                    <div class="language-file-stats">
                        <div class="language-file-progress">
                            <span>${t('file.finished')}: ${file.finished} | ${t('file.unfinished')}: ${file.unfinished}</span>
                            <div class="mini-progress-bar">
                                <div class="mini-progress-fill" style="width: ${file.progress}%"></div>
                            </div>
                            <span>${file.progress}%</span>
                        </div>
                    </div>
                    <div style="font-size: 12px; color: #57606a; margin-top: 5px;">
                        ${t('language.target_file')}: ${file.targetPath}
                    </div>
                </div>
            `).join('');
        }

        // 应用过滤器
        function applyFilters() {
            if (currentView === 'file') {
                applyFileFilters();
            } else {
                applyLanguageFilters();
            }
        }

        // 文件视图过滤器
        function applyFileFilters() {
            const pathValue = document.getElementById('pathFilter').value.toLowerCase();
            const fileItems = document.querySelectorAll('.file-item');

            fileItems.forEach(item => {
                const sourcePath = item.dataset.sourcePath.toLowerCase();
                let shouldShow = true;

                // 路径过滤
                if (pathValue && !sourcePath.includes(pathValue)) {
                    shouldShow = false;
                }

                // 语言过滤
                if (selectedLanguageFilter && shouldShow) {
                    const group = translationData.resource_groups.find(g => 
                        g.source_path === item.dataset.sourcePath
                    );
                    if (!group || !group.target_lang_codes.includes(selectedLanguageFilter)) {
                        shouldShow = false;
                    }
                }

                item.style.display = shouldShow ? 'block' : 'none';
            });
        }

        // 语言视图过滤器
        function applyLanguageFilters() {
            const pathValue = document.getElementById('pathFilter').value.toLowerCase();
            const languageItems = document.querySelectorAll('.language-item');

            languageItems.forEach(item => {
                const langCode = item.dataset.languageCode;
                let shouldShow = true;

                // 语言过滤
                if (selectedLanguageFilter && langCode !== selectedLanguageFilter) {
                    shouldShow = false;
                }

                if (shouldShow) {
                    // 在语言项内部应用文件路径过滤
                    const fileItems = item.querySelectorAll('.language-file-item');
                    let hasVisibleFiles = false;

                    fileItems.forEach(fileItem => {
                        const sourcePath = fileItem.dataset.sourcePath.toLowerCase();
                        const fileShould = !pathValue || sourcePath.includes(pathValue);
                        fileItem.style.display = fileShould ? 'block' : 'none';
                        if (fileShould) hasVisibleFiles = true;
                    });

                    // 如果没有可见的文件，隐藏整个语言项
                    shouldShow = hasVisibleFiles;
                }

                item.style.display = shouldShow ? 'block' : 'none';
            });
        }

        // 切换语言详情显示
        function toggleLanguageDetails(index) {
            const details = document.getElementById(`lang-details-${index}`);
            const icon = document.getElementById(`lang-icon-${index}`);
            
            if (details.classList.contains('show')) {
                details.classList.remove('show');
                icon.classList.remove('rotated');
            } else {
                details.classList.add('show');
                icon.classList.add('rotated');
            }
        }

        // 加载新文件
        function loadNewFile() {
            // 重置状态
            translationData = null;
            allLanguages.clear();
            currentView = 'file';
            currentFileName = '';
            currentFileSize = 0;
            languageOptions = [];
            selectedLanguageFilter = '';
            calculationMode = 'target';
            
            // 先显示上传界面
            statsContainer.style.display = 'none';
            uploadArea.style.display = 'block';
            
            // 重置视图按钮状态 (添加错误检查)
            const fileViewBtn = document.getElementById('fileViewBtn');
            const languageViewBtn = document.getElementById('languageViewBtn');
            if (fileViewBtn) fileViewBtn.classList.add('active');
            if (languageViewBtn) languageViewBtn.classList.remove('active');
            
            // 重置过滤器 (在界面切换后)
            clearFilters();
            
            // 直接重置内容，不需要克隆
            uploadArea.innerHTML = `
                <div class="upload-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75Z"/></svg></div>
                <h3>${t('upload.title')}</h3>
                <p>${t('upload.description')}</p>
                <button class="btn" onclick="document.getElementById('fileInput').click()">${t('upload.button')}</button>
                <input type="file" id="fileInput" class="file-input" accept=".json" />
            `;
            
            // 重新绑定文件输入事件
            const newFileInput = document.getElementById('fileInput');
            if (newFileInput) {
                newFileInput.addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        handleFile(e.target.files[0]);
                    }
                });
            }
            
            // 移除旧的拖拽事件监听器
            if (uploadEventHandlers) {
                uploadArea.removeEventListener('dragover', uploadEventHandlers.dragover);
                uploadArea.removeEventListener('dragleave', uploadEventHandlers.dragleave);
                uploadArea.removeEventListener('drop', uploadEventHandlers.drop);
            }
            
            // 重新绑定拖拽事件
            uploadArea.addEventListener('dragover', uploadEventHandlers.dragover);
            uploadArea.addEventListener('dragleave', uploadEventHandlers.dragleave);
            uploadArea.addEventListener('drop', uploadEventHandlers.drop);
        }

        // 页面加载完成后初始化语言
        document.addEventListener('DOMContentLoaded', () => {
            initializeLanguage();
        });
    </script>
</body>
</html>
